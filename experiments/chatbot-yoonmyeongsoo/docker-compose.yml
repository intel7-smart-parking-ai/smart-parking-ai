version: "3.8"

services:
  parkon-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parkon-chatbot
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PARK_ON_BASE_URL=${PARK_ON_BASE_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

