<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PARK:ON · 스마트 주차장 & 주차 챗봇</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-top">
        <div class="lot-title-area">
          <h1 class="lot-title" id="lot-title">개발원 주차장</h1>
          <select id="lot-selector" class="lot-selector">
            <option value="A" selected>개발원 주차장 (12면)</option>
            <option value="B">부산역 주차장 (16면)</option>
            <option value="C">김해공항 주차장 (64면)</option>
            <option value="D">신세계 백화점 주차장 (64면)</option>
          </select>
        </div>

        <!-- 5개 메인 탭 (사진 4종 공통 메뉴) -->
        <nav class="nav-tabs">
          <button class="nav-tab-btn active" data-tab="map">
            <span>⊞</span> 주차장 현황
          </button>
          <button class="nav-tab-btn" data-tab="find_car">
            <span>🚗</span> 내 차 찾기
          </button>
          <button class="nav-tab-btn" data-tab="fee">
            <span>💳</span> 요금 결제
          </button>
          <button class="nav-tab-btn" data-tab="safety">
            <span>🔔</span> 안전 안내
          </button>
          <button class="nav-tab-btn chatbot-tab" data-tab="chatbot">
            <span>🤖</span> 주차 챗봇
          </button>
        </nav>
      </div>

      <!-- 구역별 빈자리 요약 카드 (첨부 사진 일치) -->
      <div class="summary-card">
        <div class="summary-title">
          <span>구역별 빈자리</span>
          <div class="summary-stats">
            <span class="stat-item">전체 <strong id="stat-total">12면</strong></span>
            <span class="stat-item">일반 <strong id="stat-gen">8면</strong></span>
            <span class="stat-item">전기차 <strong id="stat-ev">2면</strong></span>
            <span class="stat-item">장애인 <strong id="stat-acc">1면</strong></span>
          </div>
        </div>
      </div>

      <!-- 4개 필터 탭 (사진 일치) -->
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">전체 보기</button>
        <button class="filter-btn" data-filter="empty">빈자리</button>
        <button class="filter-btn" data-filter="ev">전기차</button>
        <button class="filter-btn" data-filter="accessible">장애인</button>
      </div>
    </header>

    <!-- 1. 주차장 현황 도면 패널 -->
    <main class="map-panel" id="map-panel">
      <div class="map-header">
        <div class="map-sub-title">주차 배치도</div>
        <button class="map-zoom-btn">주차칸 확대</button>
      </div>

      <!-- 도면 외곽 프레임 -->
      <div class="map-outer-frame">
        <div id="parking-map-container">
          <!-- parkingMap.js 가 동적으로 주차장 도면을 주입합니다 -->
        </div>
      </div>

      <!-- 하단 범례 -->
      <div class="map-legend">
        <div class="legend-item"><span class="legend-dot green"></span> 주차 가능</div>
        <div class="legend-item"><span class="legend-dot gray"></span> 주차 중</div>
        <div class="legend-item"><span class="legend-dot yellow"></span> 확인 필요</div>
        <div class="legend-item"><span class="legend-dot red"></span> 확인 불가</div>
      </div>
    </main>

    <!-- 2. 주차 챗봇 전용 탭 화면 (ChatPanel) -->
    <section class="chatbot-screen-container" id="chatbot-screen">
      <div id="main-chatbot-container" style="display:flex; flex-direction:column; height:100%;">
        <!-- chatPanel.js 가 렌더링 -->
      </div>
    </section>
  </div>

  <!-- 우측 하단 플로팅 챗봇 버튼 (어느 화면에서나 즉시 호출) -->
  <div class="floating-chatbot-btn" id="floating-chat-btn" title="주차 챗봇 열기">
    🤖
  </div>

  <!-- 플로팅 챗봇 팝업 윈도우 -->
  <div class="floating-chat-window" id="floating-chat-window" style="display: none;">
    <div style="background:#2563eb; color:#ffffff; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:14px;">
      <span>PARK:ON 챗봇 도우미</span>
      <button id="floating-chat-close" style="background:transparent; border:none; color:#ffffff; font-size:18px; cursor:pointer;">✕</button>
    </div>
    <div id="floating-chatbot-container" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
      <!-- chatPanel.js 가 렌더링 -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/chatSession.js"></script>
  <script src="js/chatPanel.js"></script>
  <script src="js/parkingMap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
