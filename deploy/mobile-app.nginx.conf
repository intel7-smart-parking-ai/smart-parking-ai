# Phone preview gateway: only the user app and permitted read-only lookups.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location ~ ^/demo-api/v1/(parking-lots(?:/[A-D]/spaces)?|vehicle-search|sticker-search)$ {
    limit_except GET { deny all; }
    rewrite ^/demo-api/(.*)$ /api/$1 break;
    proxy_pass http://demo-api:8000;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store";
  }
  location /api/ { return 404; }
  location /demo-api/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
}
