# Shared session gateway routes, used by production port80 and development gateway8090.
location = /admin/login {
  proxy_set_header Host $http_host;
  proxy_pass http://admin-auth:8090/admin/login;
}
location /auth/ {
  limit_req zone=admin_login burst=5 nodelay;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $access_proto;
  proxy_pass http://admin-auth:8090;
}
location = /_admin_auth {
  internal;
  proxy_pass http://admin-auth:8090/check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Original-Method $request_method;
  proxy_set_header Origin $http_origin;
  proxy_set_header Cookie $http_cookie;
}
location /admin-api/team/ {
  auth_request /_admin_auth;
  proxy_set_header Host $http_host;
  proxy_pass http://parking_api/api/;
  proxy_read_timeout 30s;
}
# Legacy UI prefix is an alias to the same api, never a separate demo server.
location /admin-api/demo/ {
  auth_request /_admin_auth;
  proxy_set_header Host $http_host;
  proxy_pass http://parking_api/api/;
  proxy_read_timeout 30s;
}
location /admin-api/ { return 403; }
