<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARK:ON | 서비스 점검 중</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f1f5fc; color: #142641; font-family: system-ui, "Malgun Gothic", sans-serif; }
main { width: min(100%, 460px); padding: clamp(26px, 8vw, 44px); text-align: center; }
.mascot { display: block; width: 144px; height: 144px; margin: 0 auto; }
h1 { font-size: clamp(25px, 6vw, 33px); letter-spacing: -.045em; margin: 24px 0 12px; }
p { margin: 0; color: #4c607d; line-height: 1.7; word-break: keep-all; }
a { display: inline-block; margin-top: 26px; padding: 11px 18px; border-radius: 8px; background: #1748bc; color: white; font-size: 14px; font-weight: 700; text-decoration: none; }
a:hover { background: #103999; }
</style>
</head>
<body>
<main>
  <img class="mascot" src="/assets/maintenance-mascot.png" width="144" height="144" alt="">
  <h1>시스템 점검 중입니다</h1>
  <p>서비스를 업데이트하고 있습니다.<br>잠시 후 다시 접속해 주세요.</p>
  <a href="/">다시 접속</a>
</main>
</body>
</html>
