limit_req_zone $binary_remote_addr zone=access_requests:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=1r/s;
map $http_x_forwarded_proto $access_proto { default $scheme; https https; }
server {
  listen 80;
  listen 81;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  limit_req zone=access_requests burst=80 nodelay;
  limit_req_status 429;
  server_tokens off;
  client_max_body_size 64k;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Cache-Control "private, no-store" always;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location = /admin { return 302 /admin/; }
  location = /admin/login {
    proxy_pass http://admin-auth:8090/admin/login;
  }
  location /auth/ {
    limit_req zone=admin_login burst=5 nodelay;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $access_proto;
    proxy_pass http://admin-auth:8090;
  }
  location = /_admin_auth {
    internal;
    proxy_pass http://admin-auth:8090/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
  }
  location /admin/ {
    auth_request /_admin_auth;
    error_page 401 = /admin/login;
    try_files $uri /index.html;
  }
  location /admin-api/demo/ {
    auth_request /_admin_auth;
    proxy_pass http://api:8000/api/;
    proxy_read_timeout 30s;
  }
  location /admin-api/team/ {
    auth_request /_admin_auth;
    proxy_pass http://api:8000/api/;
    proxy_read_timeout 30s;
  }
  location /admin-api/ { return 403; }
  location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { try_files $uri =404; }
  # The public entry has an explicit API allowlist. Management APIs have no public alias.
  location ~ ^/demo-api/v1/(parking-lots(?:/[A-Za-z0-9_-]+/spaces)?|rate-policies|alerts|vehicle-search|sticker-search|vehicles/[0-9][0-9]/location|sessions/[A-Za-z0-9_-]+/fee)$ {
    limit_except GET { deny all; }
    rewrite ^/demo-api/(.*)$ /api/$1 break;
    proxy_pass http://api:8000;
    proxy_read_timeout 30s;
  }
  location = /demo-api/v1/mock-payments {
    limit_except POST { deny all; }
    if ($http_content_type !~ "^application/json") { return 415; }
    proxy_pass http://api:8000/api/v1/mock-payments;
  }
  location /demo-api/ { return 403; }
  location ~ ^/api/v1/(parking-lots(?:/[A-Za-z0-9_-]+/spaces)?|vehicles/[0-9][0-9]/location|sessions/[A-Za-z0-9_-]+/fee|rate-policies|alerts)$ {
    limit_except GET { deny all; }
    proxy_pass http://api:8000;
  }
  location = /api/v1/mock-payments {
    limit_except POST { deny all; }
    if ($http_content_type !~ "^application/json") { return 415; }
    proxy_pass http://api:8000;
  }
  location = /api/v1/chat {
    limit_except POST { deny all; }
    if ($http_content_type !~ "^application/json") { return 415; }
    proxy_pass http://api:8000;
  }
  location /api/ { return 403; }
  location / { try_files $uri $uri/ /index.html; }
}
