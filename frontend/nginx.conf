# 시연 PC는 Windows 포트 전달·Docker·터널을 거쳐 모든 휴대폰이 같은 접속 IP로 보인다(11/10 점검 P0-4).
# 사실상 전원 공용 한도이므로 휴대폰 수십 대 + 키오스크·관리자 폴링을 견디도록 넉넉히 둔다.
limit_req_zone $binary_remote_addr zone=access_requests:10m rate=300r/s;
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=vision_events:10m rate=120r/s;
map $http_x_forwarded_proto $access_proto { default $scheme; https https; }
upstream parking_api { server ${API_UPSTREAM}; }
# 관리자 세션(auth_request) 통과 후에만 챗봇 관리자 API 키를 붙인다. 브라우저에는 키가 노출되지 않는다.
map $host $chatbot_admin_authorization { default "Bearer ${CHATBOT_ADMIN_TOKEN}"; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  limit_req zone=access_requests burst=600 nodelay;
  limit_req_status 429;
  server_tokens off;
  client_max_body_size 64k;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Cache-Control "private, no-store" always;
  include /etc/nginx/snippets/parking-admin-routes.conf;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location = /admin { return 302 /admin/; }
  location /admin/ {
    auth_request /_admin_auth;
    error_page 401 = /admin/login;
    try_files $uri /index.html;
  }
  # Camera PC and local simulators use exactly the same authenticated receiver.
  # Never translate the camera's Bearer token into a browser/admin credential.
  location = /api/v1/internal/vision-events {
    limit_req zone=vision_events burst=200 nodelay;
    limit_except POST { deny all; }
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $http_host;
    proxy_pass http://parking_api;
    proxy_read_timeout 30s;
  }
  location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { try_files $uri =404; }
  # Public reads only. Administrator data and simulator mutations have no public alias.
  location ~ ^/api/v1/(health|parking-lots(?:/[A-Za-z0-9_-]+/spaces)?|vehicles/[0-9][0-9]/location|vehicle-search|sticker-search|sessions/[A-Za-z0-9_-]+/fee|rate-policies|alerts(?:/[A-Za-z0-9_-]+)?)$ {
    limit_except GET { deny all; }
    proxy_pass http://parking_api;
  }
  location = /api/v1/mock-payments {
    limit_except POST { deny all; }
    if ($http_content_type !~ "^application/json") { return 415; }
    proxy_pass http://parking_api;
  }
  location = /api/v1/chat {
    limit_except POST { deny all; }
    if ($http_content_type !~ "^application/json") { return 415; }
    proxy_pass http://parking_api;
    proxy_read_timeout 30s;
  }
  # 챗봇 경보·관리자 응답 알림 폴링(조회 전용). 없으면 공개 사이트에서 403이 되어 알림이 오지 않는다.
  location = /api/v1/chat/updates {
    limit_except GET { deny all; }
    proxy_pass http://parking_api;
  }
  location /api/ { return 403; }
  location /demo-api/ { return 410; }
  # 점검 화면: 웹 컨테이너 안에 /tmp/parkon-maintenance 파일이 있으면 화면 요청에 503 + 안내 페이지.
  # API·관리자·/assets/ 는 영향 없음. 켜기/끄기는 docs/RUNBOOK_DEMO_HOST.md 참고.
  location = /maintenance.html { internal; }
  location / {
    error_page 503 /maintenance.html;
    if (-f /tmp/parkon-maintenance) { return 503; }
    try_files $uri $uri/ /index.html;
  }
}

# D-25: host8090 maps to this admin-only listener; no user-web assets are served.
server {
  listen 81;
  server_name _;
  server_tokens off;
  client_max_body_size 64k;
  add_header Cache-Control "private, no-store" always;
  include /etc/nginx/snippets/parking-admin-routes.conf;
  location = /healthz { access_log off; return 200 "admin gateway\n"; }
  location = /admin { return 302 http://$host/admin/; }
  location /admin/ { return 302 http://$host/admin/; }
  location / { return 404; }
}
