name: parkon
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parkon
      POSTGRES_USER: parkon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/start.ps1 first}
      TZ: Asia/Seoul
    volumes:
      - parkon_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U parkon -d parkon']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      PGHOST: db
      PGDATABASE: parkon
      PGUSER: parkon
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run scripts/start.ps1 first}
      BILLING_PROVIDER: fixtures
      TZ: Asia/Seoul
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      target: production
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  frontend-dev:
    profiles: [dev]
    build:
      context: ./frontend
      target: development
    ports:
      - '127.0.0.1:5173:5173'
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  parkon_db:
  frontend_modules:
